name: Android Editor arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android editor (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCONS_FLAGS: >-
        dev_mode=yes
        module_text_server_fb_enabled=yes
        swappy=yes
      GODOT_ANDROID_SIGN_KEYSTORE: ${{ github.workspace }}/godot_custom.keystore
      GODOT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.GODOT_SIGN_ALIAS }}
      GODOT_ANDROID_SIGN_PASSWORD: ${{ secrets.GODOT_SIGN_PASSWORD }}
      GODOT_VERSION_STATUS: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        run: |
          if [ -n "${{ secrets.GODOT_SIGN_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.GODOT_SIGN_KEYSTORE_B64 }}" | base64 -d > "$GODOT_ANDROID_SIGN_KEYSTORE"
            echo "Keystore restored from secret."
          else
            echo "WARNING: no GODOT_SIGN_KEYSTORE_B64 secret set; APK signature will change every build."
          fi

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: android-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Swappy
        run: python ./misc/scripts/install_swappy_android.py

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: arch=arm64 production=yes
          platform: android
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: android-editor
        continue-on-error: true

      - name: Generate Godot editor APK
        run: |
          cd platform/android/java
          ./gradlew generateGodotEditor
          cd ../../..
          ls -l bin/android_editor_builds/

      - name: Upload editor APK
        uses: ./.github/actions/upload-artifact
        with:
          name: godot-android-editor-arm64
          path: bin/android_editor_builds/
