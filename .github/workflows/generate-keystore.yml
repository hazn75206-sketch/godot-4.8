name: Generate Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore and set secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and store secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 16)"
          ALIAS="godot_custom"
          keytool -genkeypair -v \
            -keystore godot_custom.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Godot Custom, OU=Custom, O=Custom, L=Custom, S=Custom, C=ID"
          B64="$(base64 -w0 godot_custom.keystore)"
          gh secret set GODOT_SIGN_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY" --body "$B64"
          gh secret set GODOT_SIGN_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
          gh secret set GODOT_SIGN_ALIAS --repo "$GITHUB_REPOSITORY" --body "$ALIAS"
          echo "Secrets set: GODOT_SIGN_ALIAS, GODOT_SIGN_KEYSTORE_B64, GODOT_SIGN_PASSWORD"
